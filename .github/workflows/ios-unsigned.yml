name: build-ios-unsigned

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm install
      - name: Sync Capacitor
        run: npx cap sync ios
      - name: Build unsigned .app
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos             -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r hm-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: hm-unsigned-ipa
          path: hm-unsigned.ipa
