workflows:
  ios-unsigned:
    name: iOS unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      node: 20
    scripts:
      - name: Install deps
        script: npm install
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Build unsigned app and package IPA
        script: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p ../../Payload
          cp -R build/Build/Products/Release-iphoneos/App.app ../../Payload/
          cd ../..
          zip -r hm-unsigned.ipa Payload
    artifacts:
      - hm-unsigned.ipa